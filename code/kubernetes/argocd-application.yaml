apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-demo
  namespace: argocd
spec:
  project: default
  source:
    # Replace with your fork before applying.
    repoURL: https://github.com/<your-user>/kiro-headless-agent-ops.git
    targetRevision: main
    path: code/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync intentionally. Switch to automated when you've validated.
