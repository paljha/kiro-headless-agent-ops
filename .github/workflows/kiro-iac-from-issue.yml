name: Kiro IaC from Issue

# Triggers when someone comments "/kiro generate" on an issue.
# Generates IaC + manifests via the multi-agent chain and opens a PR.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-iac:
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/kiro generate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov

      - name: Configure git
        run: |
          git config user.name "kiro-bot"
          git config user.email "kiro-bot@users.noreply.github.com"
          BRANCH="kiro/$(date +%Y%m%d-%H%M%S)-issue-${{ github.event.issue.number }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Run Kiro multi-agent chain
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p generated/from-issue-${{ github.event.issue.number }}
          cd generated/from-issue-${{ github.event.issue.number }}
          kiro-cli chat \
            --no-interactive \
            --trust-all-tools \
            "Run three subagents in sequence: planner -> iac-author -> security-reviewer. The user request is: $ISSUE_BODY. Stop if any subagent fails."

      - name: Commit and push
        run: |
          git add -A
          git commit -m "feat: Kiro-generated IaC for issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Kiro: IaC for issue #${{ github.event.issue.number }}" \
            --body "Closes #${{ github.event.issue.number }}

          This PR was generated by Kiro from the linked issue.

          - Plan: \`generated/from-issue-${{ github.event.issue.number }}/plan.md\`
          - Security review: \`generated/from-issue-${{ github.event.issue.number }}/review.md\`

          Review the security findings before merging."
